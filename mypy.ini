[mypy]
python_version = 3.11
# Thu vien khong co type stub (langgraph.checkpoint.*, langchain noi bo...)
# khong phai loi cua ta -> bo qua import thieu type, tap trung vao type trong src/.
ignore_missing_imports = True
# Bat canh bao huu ich nhung KHONG bat --strict de tranh ep annotate toan bo codebase.
warn_redundant_casts = True
warn_unused_ignores = True
show_error_codes = True
